name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import glob, re
          paths = [path for path in glob.glob('/Applications/Xcode_*.app')
                   if re.fullmatch(r'/Applications/Xcode_\d+(?:\.\d+)*\.app', path)]
          def version(path):
              return tuple(map(int, re.findall(r'\d+', path)))
          selected = max(paths, key=version)
          print('DEVELOPER_DIR=' + selected + '/Contents/Developer')
          PY
      - name: Verify current macOS SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
      - name: Test
        run: swift test
      - name: Build universal app
        run: bash scripts/build.sh universal
      - name: Verify bundled Figma resources and render all display modes
        run: '"dist/Codex Usage Bar.app/Contents/MacOS/CodexUsageBar" --render-indicators dist/indicator-previews'
      - name: Verify panel colors, vector icons, and all panel states
        run: '"dist/Codex Usage Bar.app/Contents/MacOS/CodexUsageBar" --render-panels dist/panel-previews'
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-macOS
          path: |
            dist/Codex-Usage-Bar-macOS.zip
            dist/SHA256SUMS.txt
            dist/indicator-previews/
            dist/panel-previews/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Usage-Bar-macOS
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Codex-Usage-Bar-macOS.zip dist/SHA256SUMS.txt --title "Codex Usage Bar $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
