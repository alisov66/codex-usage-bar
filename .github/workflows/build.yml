name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: bash scripts/build.sh universal
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Bar-macOS
          path: |
            dist/Codex-Usage-Bar-macOS.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Usage-Bar-macOS
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Codex-Usage-Bar-macOS.zip dist/SHA256SUMS.txt --title "Codex Usage Bar $RELEASE_TAG" --generate-notes
